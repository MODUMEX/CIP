name: Publicar en GitHub Pages

# Cada push a main publica la app. El CIP es un solo HTML, así que no hay
# compilación: se sube la carpeta tal cual.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar lo que se publica
        run: |
          mkdir -p publicar
          cp index.html publicar/index.html
          cp -r js publicar/js
          # GitHub Pages sirve los archivos con diez minutos de cache, asi que
          # un config.js nuevo no llegaba al navegador hasta que vencia. Se le
          # pega el commit a cada script: cambia la direccion y se baja solo.
          sed -i "s|js/config.js|js/config.js?v=${GITHUB_SHA::8}|; s|js/nube.js|js/nube.js?v=${GITHUB_SHA::8}|" publicar/index.html
          # sin esto GitHub Pages esconde las carpetas que empiezan con _
          touch publicar/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publicar

      - id: deployment
        uses: actions/deploy-pages@v4
