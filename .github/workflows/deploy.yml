name: Publicar en GitHub Pages

# Cada push a main publica la app. El CIP no se compila: son archivos sueltos
# que se suben tal cual.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar lo que se publica
        run: |
          mkdir -p publicar
          cp index.html publicar/index.html
          cp -r js publicar/js
          cp -r lib publicar/lib
          cp -r css publicar/css
          cp -r img publicar/img
          # sin esto GitHub Pages esconde las carpetas que empiezan con _
          touch publicar/.nojekyll

      # GitHub Pages sirve los archivos con diez minutos de caché, así que un
      # archivo nuevo no le llegaba al navegador hasta que vencía. Se le pega
      # el commit a cada uno: cambia la dirección y se baja solo.
      - name: Sellar los archivos con el commit
        run: |
          python3 - "$GITHUB_SHA" <<'PY'
          import re, sys
          v = sys.argv[1][:8]
          p = 'publicar/index.html'
          html = open(p, encoding='utf-8').read()
          # solo lo nuestro: lo que venga de un CDN se deja como está
          html = re.sub(r'(?<=["\'])((?:js|css|lib|img)/[^"\']+?\.(?:js|css|png|svg|jpg|webp))(?=["\'])',
                        lambda m: m.group(1) + '?v=' + v, html)
          open(p, 'w', encoding='utf-8').write(html)
          print('sellados con', v)
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publicar

      - id: deployment
        uses: actions/deploy-pages@v4
